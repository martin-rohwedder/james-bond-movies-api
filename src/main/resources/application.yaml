spring:
  application:
    name: james-bond-movies-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jb_api_db}?useUnicode=true&characterEncoding=utf8mb4
    username: ${SPRING_DATASOURCE_USERNAME:myuser}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  security:
    api-key: ${APP_SECURITY_API_KEY:test-api-key}

logging:
  level:
    dk.martinrohwedder.james_bond_movies_api: INFO

spring:
  application:
    name: james-bond-movies-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8mb4

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  security:
    api-key: ${API_KEY}

logging:
  level:
    dk.martinrohwedder.james_bond_movies_api: INFO

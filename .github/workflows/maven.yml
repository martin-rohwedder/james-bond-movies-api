# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: write

jobs:
  test:
    # Skip runs triggered by the badge update commit
    if: github.actor != 'github-actions[bot]'

    name: Test and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify project
        run: ./mvnw -B verify

      - name: Generate JaCoCo badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          badges-directory: .github/badges
          generate-branches-badge: true
          generate-summary: true
          coverage-type: line

      - name: Upload JaCoCo badge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-badge
          path: .github/badges/jacoco.svg

      - name: Add coverage to workflow summary
        run: |
          echo "## Code coverage" >> $GITHUB_STEP_SUMMARY
          echo "Line coverage: **${{ steps.jacoco.outputs.coverage }}%**" >> $GITHUB_STEP_SUMMARY
          echo "Branch coverage: **${{ steps.jacoco.outputs.branches }}%**" >> $GITHUB_STEP_SUMMARY

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update JaCoCo coverage badge [skip ci]"
          file_pattern: .github/badges/jacoco.svg

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
